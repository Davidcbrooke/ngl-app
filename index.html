<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NGL Club Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head><body>
<div class="bar7"><i style="background:var(--pre)"></i><i style="background:var(--sch)"></i><i style="background:var(--rec)"></i><i style="background:var(--gen)"></i><i style="background:var(--perf)"></i><i style="background:var(--uni)"></i><i style="background:var(--mas)"></i></div>
<div id="authRoot" hidden></div>
<div class="app">
  <aside class="side">
    <img class="logo" src="https://davidcbrooke.github.io/GYMNASTICS-RESULTS/brand/ngl-logo-full.png" alt="National Gymnastics League">
    <div class="club" id="clubCard"></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="foot">OFFICIAL SPONSOR<img src="https://davidcbrooke.github.io/GYMNASTICS-RESULTS/brand/justgo-logo-white.png" alt="JustGo"></div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="search" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" placeholder="Search: rules, floor music, invoice, lesson plans…" autocomplete="off" aria-label="Search the Club Hub">
        <div class="results" id="res"></div>
      </div>
      <div class="who" id="who"></div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>
<div class="sandbox" id="sandbox" hidden>SANDBOX</div>
<script type="module" src="js/app.js"></script>
</body></html>
